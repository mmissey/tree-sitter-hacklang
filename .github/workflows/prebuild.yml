name: Prebuild & publish

# Builds N-API prebuilt binaries on each OS with prebuildify, then (on a version
# tag, or a manual run with publish=true) assembles them and publishes to npm.
# N-API prebuilds are ABI-stable across Node versions, so one build per platform
# is enough — no Node-version matrix needed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm after building"
        type: boolean
        default: false

jobs:
  prebuild:
    name: prebuild (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # linux-x64
          # macos-14 (Apple Silicon) builds BOTH darwin-arm64 (native) and
          # darwin-x64 (cross-compiled via clang -arch x86_64). GitHub's Intel
          # macos-13 runners are being retired and frequently never schedule,
          # so we no longer use a separate Intel runner.
          - os: macos-14 # darwin-arm64 + darwin-x64
          # Pin to windows-2022 (VS 2022 / v17). windows-latest is now Windows
          # Server 2025, which ships VS 18 (2026) — node-gyp can't detect it
          # ("unknown version undefined") and its PowerShell VS finder overflows
          # the stdio buffer, breaking the native build.
          - os: windows-2022 # win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --ignore-scripts: install devDeps (node-gyp, prebuildify) without running
      # the package's own `install` script; prebuildify does the build below.
      - run: npm install --ignore-scripts
      - name: Build prebuilt binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx prebuildify --napi        # no `strip` tool on Windows runners
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npx prebuildify --napi --strip --arch arm64   # native
            npx prebuildify --napi --strip --arch x64     # cross-compile for Intel Macs
          else
            npx prebuildify --napi --strip
          fi
          ls -R prebuilds
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds/
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: prebuild
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no NPM_TOKEN. Requires a trusted publisher to be
    # configured for this package on npmjs.com (Settings -> Trusted Publishers)
    # pointing at this repo + workflow. The package must already exist, so the
    # very first 0.1.0 publish is done manually to bootstrap it.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (and automatic provenance) needs npm >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      # Merge every platform's artifact back into prebuilds/<platform-arch>/...
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - name: Show assembled prebuilds
        run: ls -R prebuilds
      - run: npm install --ignore-scripts
      - run: npm publish --access public
